apiVersion: v2
name: securescope
description: Enterprise SECops Platform for Automated Vulnerability Discovery
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - security
  - vulnerability
  - scanning
  - devops
  - xss
home: https://securescope.com
sources:
  - https://github.com/yourusername/securescope
maintainers:
  - name: SecureScope Team
    email: support@securescope.com
dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: elasticsearch
    version: 19.x.x
    repository: https://helm.elastic.co
    condition: elasticsearch.enabled